title: Encoded PowerShell Command Execution
id: 8a1f4c62-9d3e-4b17-a5e0-2c7f91d4b806
status: experimental
description: |
  Detects PowerShell executed with a base64-encoded command block. Matches all valid
  abbreviations of -EncodedCommand, since PowerShell accepts any unambiguous prefix.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://github.com/SigmaHQ/sigma
author: Kamsochi Ekwueme
date: 2026-09-09
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_cli:
        CommandLine|contains:
            - ' -enc '
            - ' -encodedcommand '
            - ' -ec '
            - ' -e '
            - ' /enc '
            - ' /e '
    condition: selection_img and selection_cli
falsepositives:
    - Software installers and MSI custom actions
    - Endpoint management agents such as SCCM, Intune, and RMM tooling
    - Developer tooling and CI agents
level: medium
